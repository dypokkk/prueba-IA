<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Global Language Academy - Support Assistant{% endblock %}</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                        },
                        emerald: {
                            500: '#10b981',
                            600: '#059669',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Marked.js Markdown Parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/custom.css">
</head>
<body class="h-full flex flex-col text-slate-100 antialiased selection:bg-brand-500 selection:text-white">

    <!-- Top Navigation Bar -->
    <header class="bg-slate-800/90 backdrop-blur border-b border-slate-700/80 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <!-- Logo & Brand -->
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-emerald-500 flex items-center justify-center shadow-lg shadow-brand-500/20">
                        <i class="fa-solid fa-graduation-cap text-white text-lg"></i>
                    </div>
                    <div>
                        <span class="font-bold text-lg text-white tracking-tight">Global Language Academy</span>
                        <span class="hidden sm:inline-block ml-2 px-2 py-0.5 text-xs font-semibold bg-brand-900/60 text-brand-300 rounded-full border border-brand-700/50">AI Support</span>
                    </div>
                </div>

                <!-- Navigation Links -->
                <nav class="flex items-center space-x-1 sm:space-x-2">
                    <a href="/chat" class="px-3 py-2 rounded-lg text-sm font-medium transition-all {% if active_tab == 'chat' %}bg-brand-600 text-white shadow-md shadow-brand-600/30{% else %}text-slate-300 hover:text-white hover:bg-slate-700/60{% endif %}">
                        <i class="fa-regular fa-comments mr-1.5"></i> Chat
                    </a>
                    <a href="/dashboard" class="px-3 py-2 rounded-lg text-sm font-medium transition-all {% if active_tab == 'dashboard' %}bg-brand-600 text-white shadow-md shadow-brand-600/30{% else %}text-slate-300 hover:text-white hover:bg-slate-700/60{% endif %}">
                        <i class="fa-solid fa-chart-line mr-1.5"></i> Metrics & Docs
                    </a>
                    <a href="/escalations" class="px-3 py-2 rounded-lg text-sm font-medium transition-all {% if active_tab == 'escalations' %}bg-brand-600 text-white shadow-md shadow-brand-600/30{% else %}text-slate-300 hover:text-white hover:bg-slate-700/60{% endif %}">
                        <i class="fa-solid fa-headset mr-1.5"></i> Support Desk
                    </a>
                </nav>

                <!-- Live Status Badge -->
                <div class="hidden md:flex items-center space-x-2 bg-slate-900/80 px-3 py-1.5 rounded-full border border-slate-700/60">
                    <span class="relative flex h-2.5 w-2.5">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
                    </span>
                    <span class="text-xs text-slate-300 font-medium">System Online</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 flex flex-col">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-slate-950 border-t border-slate-800/80 py-4 text-center text-xs text-slate-400">
        <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2">
            <div>&copy; 2026 Global Language Academy SAS &bull; Intelligent Customer Support Engine</div>
            <div class="flex items-center space-x-4">
                <span><i class="fa-solid fa-bolt text-amber-400 mr-1"></i> Deterministic + Gemini RAG</span>
                <span><i class="fa-solid fa-network-wired text-brand-400 mr-1"></i> WebSockets Enabled</span>
            </div>
        </div>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
