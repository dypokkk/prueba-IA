version: '3.8'

services:
  assistant-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: global_language_academy_assistant
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - APP_ENV=development
      - DEBUG=true
      - PORT=8000
      - HOST=0.0.0.0
      - PYTHONUNBUFFERED=1
    volumes:
      # Bind mount enables hot-reload in local development
      - .:/app
    # Override the production CMD with --reload for local dev
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
